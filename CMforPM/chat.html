<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Compass — Conversation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .chat-container {
        max-width: 900px;
        margin: 40px auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: calc(100vh - 200px);
        min-height: 600px;
      }
      .chat-header {
        padding: 20px;
        background: var(--primary);
        color: white;
        border-bottom: 1px solid var(--border);
      }
      .chat-header h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .chat-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }
      .chat-messages {
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--bg);
      }
      .message {
        display: flex;
        flex-direction: column;
        max-width: 70%;
        animation: fadeIn 0.3s;
      }
      .message.own {
        align-self: flex-end;
      }
      .message.other {
        align-self: flex-start;
      }
      .message-header {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .message.own .message-header {
        text-align: right;
      }
      .message-bubble {
        padding: 12px 16px;
        border-radius: 12px;
        word-wrap: break-word;
      }
      .message.own .message-bubble {
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .message.other .message-bubble {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .message-time {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
      }
      .message.own .message-time {
        text-align: right;
      }
      .chat-input-area {
        padding: 20px;
        background: var(--card);
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      .chat-input {
        padding: 12px;
        border: 1px solid var(--border-dark);
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        resize: none;
      }
      .chat-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
      }
      .no-access {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-dim);
      }
      .no-access h2 {
        color: var(--primary);
        margin-bottom: 12px;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .item-info {
        background: #f3f4f6;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .item-info strong {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="dashboard.html" aria-label="Campus Compass home">
          <span class="brand-logo" aria-hidden="true"></span>
          <span class="brand-name">Campus Compass</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-list">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="home.html">Home</a></li>
          </ul>
        </nav>
        <div class="auth-actions"></div>
      </div>
    </header>

    <main>
      <section class="hero-institutional">
        <div class="container">
          <div id="chat-container" class="chat-container">
            <!-- Content will be loaded by JavaScript -->
          </div>
          <div id="no-access" class="no-access" style="display: none;">
            <h2>Access Denied</h2>
            <p>You don't have permission to view this conversation.</p>
            <a href="dashboard.html" class="btn btn-primary" style="margin-top: 16px;">Back to Dashboard</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <span class="brand-mark" aria-hidden="true">🧭</span>
          <span class="brand-name">Campus Compass</span>
        </div>
        <nav aria-label="Footer">
          <ul class="footer-nav">
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
        <p class="copyright">© <span id="year"></span> Campus Compass</p>
      </div>
    </footer>

    <script>
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());
    </script>
    <script src="assets/js/database.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/chat.js"></script>
  </body>
</html>
